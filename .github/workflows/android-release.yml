name: Build Android Release APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Export Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK & Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" || true

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Environment and Generate Release Keystore
        run: |
          # Ensure .env exists for Secrets Gradle plugin
          touch .env
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

          # إنشاء ملف release.keystore تلقائياً داخل الطرفية
          KEYPASS="${{ secrets.RELEASE_KEY_PASSWORD }}"
          STOREPASS="${{ secrets.RELEASE_STORE_PASSWORD }}"
          
          # استبدال القيم بقيم افتراضية في حال عدم ضبط الـ Secrets
          if [ -z "$KEYPASS" ]; then KEYPASS="androidreleasepass"; fi
          if [ -z "$STOREPASS" ]; then STOREPASS="androidreleasepass"; fi

          echo "Generating Release Keystore inside terminal..."
          keytool -genkey -v -keystore release.keystore \
            -storepass "$STOREPASS" \
            -alias releasekey \
            -keypass "$KEYPASS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Release Build, O=Android, C=US"

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'androidreleasepass' }}
          RELEASE_KEY_ALIAS: releasekey
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'androidreleasepass' }}
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RafiqAlMuslim-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
