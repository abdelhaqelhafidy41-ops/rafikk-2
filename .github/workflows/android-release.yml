name: Android Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release draft'
        required: false
        type: boolean
        default: true

jobs:
  build-release:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK & Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" || true

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Environment and Release Keystore
        run: |
          # Ensure .env exists for Secrets Gradle plugin
          touch .env
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

          # Setup Release Keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "Release keystore restored from secrets"
          elif [ ! -f my-upload-key.jks ]; then
            echo "Creating automated upload keystore for release packaging"
            keytool -genkey -v \
              -keystore my-upload-key.jks \
              -storepass android \
              -alias upload \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Rafiq Al-Muslim Release,O=AIStudio,C=SA"
          fi
          cp my-upload-key.jks app/my-upload-key.jks 2>/dev/null || true

      - name: Build Optimized Release APK and App Bundle (AAB)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --no-configuration-cache --no-build-cache --stacktrace

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RafiqAlMuslim-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RafiqAlMuslim-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release (On Tag or Dispatch)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          name: "رفيق المسلم الإصدار ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
